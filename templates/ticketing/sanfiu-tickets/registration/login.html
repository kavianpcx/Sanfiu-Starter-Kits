{% extends "base.html" %}{% block title %}Seller sign in · Sanfiu Tickets{% endblock %}{% block content %}<section class="auth wrap"><div class="auth-card"><p class="eyebrow">SELLER ACCOUNT</p><h1>Welcome back.</h1>{% if form.errors %}<p class="error">The username and password did not match.</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="button button-dark" type="submit">Sign in</button></form><p>New to selling? <a href="{% url 'seller_signup' %}">Open a seller account</a></p></div></section>{% endblock %}
